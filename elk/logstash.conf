# ─── Logstash Pipeline — SIEM Home Lab ───────────────────────────────────────

input {

  # Logs envoyés via TCP (scripts Python)
  tcp {
    port => 5000
    codec => json
  }

  # Logs envoyés via UDP (syslog)
  udp {
    port => 5000
    codec => json
  }

  # Fichiers logs Linux
  file {
    path => "/var/log/auth.log"
    start_position => "beginning"
    type => "auth"
    tags => ["linux", "auth"]
  }

  file {
    path => "/var/log/syslog"
    start_position => "beginning"
    type => "syslog"
    tags => ["linux", "syslog"]
  }

}

filter {

  # ── Parse SSH brute force ──
  if [type] == "auth" {
    grok {
      match => {
        "message" => [
          "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} sshd\[%{NUMBER:pid}\]: %{DATA:ssh_event} password for %{DATA:username} from %{IP:src_ip} port %{NUMBER:src_port}",
          "%{SYSLOGTIMESTAMP:timestamp} %{HOSTNAME:hostname} sshd\[%{NUMBER:pid}\]: Invalid user %{DATA:username} from %{IP:src_ip}"
        ]
      }
    }

    # Classifie l'événement
    if "Failed password" in [message] {
      mutate { add_field => { "alert_type" => "ssh_bruteforce" "severity" => "HIGH" } }
    }
    if "Accepted password" in [message] {
      mutate { add_field => { "alert_type" => "ssh_success" "severity" => "INFO" } }
    }
    if "Invalid user" in [message] {
      mutate { add_field => { "alert_type" => "ssh_invalid_user" "severity" => "MEDIUM" } }
    }
    if "Accepted password for root" in [message] {
      mutate { add_field => { "alert_type" => "root_login" "severity" => "CRITICAL" } }
    }
  }

  # ── Géolocalisation IP ──
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
    }
  }

  # ── Timestamp ──
  date {
    match => ["timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
    target => "@timestamp"
  }

  # ── Nettoyage ──
  mutate {
    remove_field => ["host", "agent", "ecs"]
  }

}

output {

  # Envoi vers Elasticsearch
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index => "siem-logs-%{+YYYY.MM.dd}"
  }

  # Debug console (désactiver en prod)
  stdout {
    codec => rubydebug
  }

}