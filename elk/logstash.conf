# ─── Logstash Pipeline — SIEM Home Lab ───────────────────────────────────────
# Entrée : lignes de log brutes envoyées en JSON par scripts/ingest_logs.py
#          {"message": "<ligne syslog>", "log_type": "auth", "log_file": "..."}
# Sortie : index siem-logs-YYYY.MM.dd, avec les champs parsés et classifiés

input {

  # Scripts Python (une ligne JSON par événement)
  tcp {
    port  => 5000
    codec => json_lines
  }

  # Envoi ponctuel en UDP
  udp {
    port  => 5000
    codec => json
  }

}

filter {

  # ── Parsing des lignes auth.log / syslog ──
  grok {
    match => {
      "message" => [
        "%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST:hostname} sshd\[%{POSINT:pid}\]: Failed password for (?:invalid user )?%{USERNAME:username} from %{IP:src_ip} port %{POSINT:src_port}",
        "%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST:hostname} sshd\[%{POSINT:pid}\]: Accepted %{WORD:auth_method} for %{USERNAME:username} from %{IP:src_ip} port %{POSINT:src_port}",
        "%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST:hostname} sshd\[%{POSINT:pid}\]: Invalid user %{USERNAME:username} from %{IP:src_ip}(?: port %{POSINT:src_port})?",
        "%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST:hostname} sudo(?:\[%{POSINT:pid}\])?: +%{USERNAME:username} : .*COMMAND=%{GREEDYDATA:command}",
        "%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST:hostname} su(?:\[%{POSINT:pid}\])?: FAILED SU \(to %{USERNAME:target_user}\) %{USERNAME:username}",
        "%{SYSLOGTIMESTAMP:log_timestamp} %{SYSLOGHOST:hostname} %{DATA:program}(?:\[%{POSINT:pid}\])?: %{GREEDYDATA:log_message}"
      ]
    }
    tag_on_failure => ["_unparsed"]
  }

  # ── Classification de l'événement ──
  if [message] =~ /Failed password for/ {
    mutate { add_field => { "alert_type" => "ssh_failed" "severity" => "HIGH" } }
  } else if [message] =~ /Accepted \w+ for root from/ {
    mutate { add_field => { "alert_type" => "root_login" "severity" => "CRITICAL" } }
  } else if [message] =~ /Accepted \w+ for/ {
    mutate { add_field => { "alert_type" => "ssh_success" "severity" => "INFO" } }
  } else if [message] =~ /Invalid user/ {
    mutate { add_field => { "alert_type" => "ssh_invalid_user" "severity" => "MEDIUM" } }
  } else if [message] =~ /FAILED SU/ {
    mutate { add_field => { "alert_type" => "su_failed" "severity" => "CRITICAL" } }
  } else if [message] =~ /sudo.*COMMAND=/ {
    mutate { add_field => { "alert_type" => "sudo" "severity" => "MEDIUM" } }
  } else {
    mutate { add_field => { "alert_type" => "generic" "severity" => "INFO" } }
  }

  # ── Géolocalisation IP (échoue silencieusement sur les IP privées) ──
  if [src_ip] {
    geoip {
      source => "src_ip"
      target => "geoip"
      tag_on_failure => ["_geoip_lookup_failure"]
    }
  }

  # @timestamp = heure d'ingestion : les règles de détection travaillent en
  # temps réel. L'heure d'origine de la ligne reste dans log_timestamp.

}

output {

  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    user     => "elastic"
    password => "${ELASTIC_PASSWORD}"
    index    => "siem-logs-%{+YYYY.MM.dd}"
  }

  # Debug : décommenter pour voir chaque événement dans `docker logs logstash`
  # stdout { codec => rubydebug }

}
