# ─── Règle de détection : Connexion Suspecte ─────────────────────────────────
# Détecte les connexions anormales : root, heures creuses, IP jamais vue.
# Exécutée par scripts/detect.py

rule:
  id: AUTH-002
  name: Suspicious Login Detected
  severity: CRITICAL
  category: authentication

description: >
  Détecte les connexions suspectes sur le système :
  connexion root réussie, connexion en dehors des heures ouvrées,
  ou connexion depuis une IP jamais vue auparavant.

detection:
  type: match
  index: siem-logs-*
  conditions:
    - id: root_login
      description: Connexion SSH réussie avec le compte root
      filter:
        alert_type: root_login
      severity: CRITICAL

    - id: off_hours_login
      description: Connexion réussie entre 22h et 6h (heure locale)
      filter:
        alert_type: [ssh_success, root_login]
      hours:
        start: 22
        end: 6
      severity: HIGH

    - id: new_ip_login
      description: Connexion réussie depuis une IP jamais vue avant la fenêtre analysée
      filter:
        alert_type: [ssh_success, root_login]
      first_seen: src_ip
      severity: MEDIUM

response:
  message: "Connexion suspecte ({condition_id}) : {username} depuis {src_ip}"

mitre_attack:
  tactic: Initial Access
  technique: T1078
  subtechnique: T1078.003 — Valid Accounts / Local Accounts

references:
  - https://attack.mitre.org/techniques/T1078/

author: bonberoww
version: 1.1.0
created: 2025-03-01
