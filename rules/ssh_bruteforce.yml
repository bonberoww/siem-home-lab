# ─── Règle de détection : SSH Brute Force ────────────────────────────────────
# Déclenche une alerte si plus de 5 tentatives SSH échouées
# depuis la même IP en moins de 60 secondes.
# Exécutée par scripts/detect.py

rule:
  id: SSH-001
  name: SSH Brute Force Detected
  severity: HIGH
  category: authentication

description: >
  Détecte les tentatives de brute force SSH en surveillant
  les échecs d'authentification répétés depuis une même IP source.
  Seuil : plus de 5 tentatives échouées en 60 secondes.

detection:
  type: threshold
  index: siem-logs-*
  filter:
    alert_type: ssh_failed
  group_by: src_ip
  threshold: 5          # alerte si count > threshold
  timeframe: 60         # secondes (fenêtre glissante)

response:
  message: "Brute force SSH : {count} échecs en {timeframe}s depuis {src_ip} (utilisateur ciblé : {username})"

mitre_attack:
  tactic: Credential Access
  technique: T1110
  subtechnique: T1110.001 — Brute Force / Password Guessing

references:
  - https://attack.mitre.org/techniques/T1110/001/

author: bonberoww
version: 1.1.0
created: 2025-03-01
