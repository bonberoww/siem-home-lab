# ─── Règle de détection : SSH Brute Force ────────────────────────────────────
# Déclenche une alerte si plus de 5 tentatives SSH échouées
# depuis la même IP en moins de 60 secondes

rule:
  id: SSH-001
  name: SSH Brute Force Detected
  severity: HIGH
  category: authentication

description: >
  Détecte les tentatives de brute force SSH en surveillant
  les échecs d'authentification répétés depuis une même IP source.
  Seuil : 5 tentatives échouées en 60 secondes.

detection:
  condition: count(failed_ssh) > 5
  timeframe: 60s
  group_by: src_ip
  filter:
    alert_type: ssh_bruteforce

response:
  - action: alert
    channel: webhook
    message: >
      ALERTE SSH-001 — Brute force détecté
      IP source   : {src_ip}
      Tentatives  : {count}
      Utilisateur : {username}
      Timestamp   : {timestamp}

  - action: log
    output: reports/ssh_bruteforce_{timestamp}.txt

mitre_attack:
  tactic: Credential Access
  technique: T1110
  subtechnique: T1110.001 — Brute Force / Password Guessing

references:
  - https://attack.mitre.org/techniques/T1110/001/
  - https://www.elastic.co/guide/en/siem/guide/current/ssh-brute-force.html

author: bonberoww
version: 1.0.0
